<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>

    .mindar-ui-overlay {
      display: none !important;
    }
    
    .mindar-ui-scanning {
      display: none !important;
    }

    /* Overlay container */
    #scan-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.5s;
    }
    
    /* Hide overlay when marker found */
    #scan-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Target marker image */
    #target-image {
      max-width: 60%;
      max-height: 40%;
      border: 3px solid white;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    /* Instruction text */
    #instruction-text {
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 0 20px;
      animation: pulse 2s infinite;
    }
    
    /* Pulse animation */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Scanning frame animation */
    #scan-frame {
      position: absolute;
      width: 80%;
      height: 50%;
      border: 3px dashed white;
      border-radius: 10px;
      animation: scan-pulse 1.5s infinite;
    }
    
    @keyframes scan-pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  
  <!-- Scan Overlay -->
  <div id="scan-overlay">
    <div id="scan-frame"></div>
    <img id="target-image" src="targets/marker.png" alt="Scan this marker">
    <div id="instruction-text">
      📷 Point camera at this image
    </div>
  </div>
  
<a-scene mindar-image="imageTargetSrc: ./targets/engine.mind; 
                       filterMinCF: 0.001;
                       filterBeta: 0.01;
                       warmupTolerance: 5;
                       uiLoading: no; 
                       uiScanning: no;" 
         vr-mode-ui="enabled: false" 
         device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="myVideo" 
             src="videos/testVideo.mp4"
             preload="auto" 
             loop="true"
             playsinline>
      </video>
    </a-assets>
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane 
        position="0 -0.22 0"
        width="0.83" 
        height="0.5"
        rotation="0 0 0"
        material="src: #myVideo; shader: flat">
      </a-plane>
    </a-entity>

  </a-scene>
  
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const video = document.getElementById('myVideo');
    const target = document.querySelector('[mindar-image-target]');
    const overlay = document.getElementById('scan-overlay');
    
    target.addEventListener('targetFound', function() {
      overlay.classList.add('hidden');
      video.play();
      console.log('Video playing!');
    });
    
    target.addEventListener('targetLost', function() {
      overlay.classList.remove('hidden');
      video.pause();  // ← ADD THIS LINE
      console.log('Video paused');
    });
  });
</script>
  
</body>
</html>
